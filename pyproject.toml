[project]
name = "llm2jev"
version = "0.5.0"
description = "Any chat model, any engine (SGLang, vLLM, transformers, MLX) as a Jev-compatible probability decision service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["requests", "transformers>=4.51", "jinja2"]  # jinja2: chat templates

[project.urls]
Repository = "https://github.com/tic-top/llm2jev"

[project.optional-dependencies]
hf = ["torch", "pillow", "accelerate", "av", "librosa"]  # av: video frames, librosa: audio
vision = ["torchvision", "pillow"]
mlx = ["mlx-lm"]  # Apple silicon
test = ["pytest"]

[project.scripts]
llm2jev = "llm2jev.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm2jev"]
