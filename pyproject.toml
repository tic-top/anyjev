[project]
name = "anyjev"
version = "0.1.0"
description = "Any chat model, any engine (SGLang, vLLM, transformers) as a Jev-compatible probability decision service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["requests", "transformers>=4.51", "jinja2"]  # jinja2: chat templates

[project.optional-dependencies]
hf = ["torch", "pillow", "accelerate", "av", "librosa"]  # av: video frames, librosa: audio
vision = ["torchvision", "pillow"]
test = ["pytest"]

[project.scripts]
anyjev = "anyjev.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anyjev"]
